services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlyno_lab
      POSTGRES_USER: qlyno
      POSTGRES_PASSWORD: qlyno_dev_password
    ports:
      - "5432:5432"
    volumes:
      - qlyno_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlyno -d qlyno_lab"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  qlyno_postgres:
